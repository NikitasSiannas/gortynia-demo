<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="description" content="Χάρτης με τα πανηγύρια, τις λαϊκές βραδιές και τα πάρτυ στα χωριά της Γορτυνίας και της Αρκαδίας." />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Εγκατάσταση σε iPhone ("Προσθήκη στην οθόνη Αφετηρίας") -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Πανηγύρια" />

    <!-- Προεπισκόπηση όταν κοινοποιείται (Facebook, Viber, WhatsApp, Messenger) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Πανηγύρια Γορτυνίας" />
    <meta property="og:title" content="Πανηγύρια Γορτυνίας" />
    <meta property="og:description" content="Πανηγύρια, λαϊκές βραδιές & πάρτυ στα χωριά της Γορτυνίας και της Αρκαδίας — στον χάρτη." />
    <meta property="og:image" content="https://gortynia-demo.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://gortynia-demo.vercel.app/" />
    <meta property="og:locale" content="el_GR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Πανηγύρια Γορτυνίας</title>

    <!-- Εφαρμογή θέματος πριν φορτώσει η σελίδα, για να μην "αναβοσβήνει" -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "auto";
          var dark = pref === "dark";
          if (pref === "auto") {
            var h = new Date().getHours();
            dark = h >= 20 || h < 7;
          }
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Χρειάζεται JavaScript για να λειτουργήσει η εφαρμογή.</noscript>
    <div id="root"></div>
  </body>
</html>
